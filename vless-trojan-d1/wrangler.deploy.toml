name = "xui"
main = "_worker.js"
compatibility_date = "2026-09-08"

[triggers]
crons = ["0 3 * * *"]

# 放置区域：香港（gcp:asia-east2），区域放置
[placement]
region = "gcp:asia-east2"

# Workers 日志：开启 logpush / traces
[observability]
enabled = true

# geo 更新队列：手动/定时更新入队，由 consumer 独立执行
[[queues.producers]]
binding = "GEO_QUEUE"
queue = "cf-vless-trojan-d1-geo-update"

[[queues.consumers]]
queue = "cf-vless-trojan-d1-geo-update"
max_batch_size = 1
max_retries = 2
dead_letter_queue = "cf-vless-trojan-d1-geo-update-dlq"

[[d1_databases]]
binding = "DB"
database_name = "cf-vless-trojan-d1"
database_id = "5f52cce4-aab3-4db4-b34b-0e2edf61ae86"

[[kv_namespaces]]
binding = "GEO_KV"
id = "1e0672d1e9cf4c4d9b6f91976d471249"

# Durable Objects：WebSocket 代理会话托管（长连接，突破 30s idle 断连）
# 注意：不写 [[migrations]] —— 线上已存在 ProxySessionDO 类，
# new_sqlite_classes 重复声明会报 code 10074
[durable_objects]
bindings = [{ name = "PROXY_DO", class_name = "ProxySessionDO" }]

# wrangler 4 新语法：声明 DO 类的 live exports（storage=sqlite 与线上已迁移类一致）
[exports.ProxySessionDO]
type = "durable-object"
storage = "sqlite"
